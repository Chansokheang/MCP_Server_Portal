# Bizplay MCP stack.
#
#   docker compose up --build
#
# Published ports default to the 9010 to 9020 range. Override any of them, and
# the public host name, in a .env file next to this one (see .env.example).
#
#   portal            http://HOST:9012
#   curated gateway   http://HOST:9010/mcp
#   registry gateway  http://HOST:9011/mcp
#   mock Bizplay API  http://HOST:9013   (internal name: legacy-api)
#
# Containers always listen on their fixed internal ports; only the published
# port changes. PUBLIC_* URLs tell the portal which address to hand to agents,
# so the setup instructions on each API detail page stay correct.

x-public-env: &public-env
  BIZPLAY_PUBLIC_GATEWAY_URL: http://${PUBLIC_HOST:-127.0.0.1}:${GATEWAY_PORT:-9010}/mcp
  BIZPLAY_PUBLIC_REGISTRY_URL: http://${PUBLIC_HOST:-127.0.0.1}:${REGISTRY_PORT:-9011}/mcp

x-app: &app
  build: .
  image: bizplay-mcp:latest
  # The image is built here, never pulled from a registry.
  pull_policy: build
  restart: unless-stopped
  volumes:
    - state:/app/data
    - logs:/app/logs

services:
  legacy-api:
    <<: *app
    command: ["legacy-bizplay-api", "--host", "0.0.0.0", "--port", "18080"]
    environment:
      <<: *public-env
      # Service tokens the mock API accepts (comma-separated).
      BIZPLAY_API_TOKENS: ${BIZPLAY_API_TOKENS:-demo-service-token}
    ports:
      # Remove this mapping in production: only the gateways need to reach it.
      - "${LEGACY_API_PORT:-9013}:18080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  portal:
    <<: *app
    command: ["bizplay-portal", "--host", "0.0.0.0", "--port", "18090"]
    environment:
      <<: *public-env
      # Seed the Bizplay provider with the in-network API address.
      BIZPLAY_SEED_API_URL: http://legacy-api:18080
    ports:
      - "${PORTAL_PORT:-9012}:18090"
    depends_on:
      legacy-api:
        condition: service_healthy

  gateway:
    <<: *app
    command: ["bizplay-mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *public-env
      BIZPLAY_API_BASE_URL: http://legacy-api:18080
      BIZPLAY_API_TOKEN: ${BIZPLAY_API_TOKENS:-demo-service-token}
    ports:
      - "${GATEWAY_PORT:-9010}:8000"
    depends_on:
      legacy-api:
        condition: service_healthy
      portal:
        condition: service_started

  registry-gateway:
    <<: *app
    # Builds its tools from the providers published in the portal at startup.
    # Restart this service after publishing a new provider.
    command: ["bizplay-mcp-registry", "--transport", "http", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *public-env
    ports:
      - "${REGISTRY_PORT:-9011}:8002"
    depends_on:
      portal:
        condition: service_started

  # Optional: an HTTPS address for clients that refuse plain HTTP, such as
  # claude.ai and ChatGPT. Not started by default.
  #
  #   docker compose --profile tunnel up -d tunnel
  #   docker compose logs tunnel | grep trycloudflare.com
  #
  # The URL is random and changes on every restart, and the tunnel is public
  # with no authentication in front of it. For a stable address, put nginx with
  # a certificate in front of the registry gateway instead.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://registry-gateway:8002
    depends_on:
      registry-gateway:
        condition: service_started

volumes:
  state:
  logs:
